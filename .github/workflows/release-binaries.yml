name: Release binaries

# Cross-platform release automation: builds the compiled fusion-code binary
# for macOS (arm64 + x64), Linux (x64 + arm64) and Windows (x64) and uploads
# the archives to the GitHub release for the pushed tag. The whole
# build/package pipeline lives in scripts/package-release.sh (runnable
# locally with the same behavior); this workflow is a thin wrapper.
#
# Each archive carries the binary plus FUSION.rules.example — the reference
# rule-file template users copy to ~/.fusion-code/FUSION.rules. The template
# is secret-scanned by the script before packaging (no keys/tokens).
#
# Bun cross-compiles every target from a single Linux runner; the darwin and
# linux binaries are smoke-tested (fusion-code-<target> --version) inside the
# script. Windows binaries are SHA-verified only — run
# `fusion-code-windows-x64.exe --version` once on a Windows box after
# download.
#
# Triggers:
# - pushing a v* tag builds and uploads to that tag's release
# - workflow_dispatch with upload_tag set builds and uploads to an existing
#   release (assets only, no release creation); empty = artifacts only

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            upload_tag:
                description: "Existing release tag to upload assets to (empty = artifacts only)"
                required: false
                default: ""

permissions:
    contents: write

concurrency:
    group: release-binaries-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.14"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build and package all targets
              run: scripts/package-release.sh dist/release

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: release-assets
                  path: |
                      dist/release/*.tar.gz
                      dist/release/*.zip
                      dist/release/SHA256SUMS.txt
                  retention-days: 7
                  if-no-files-found: error

    release:
        needs: build
        if: startsWith(github.ref, 'refs/tags/v') || inputs.upload_tag != ''
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/download-artifact@v4
              with:
                  name: release-assets
                  path: dist

            - name: Resolve release tag
              id: tag
              run: echo "tag=${{ inputs.upload_tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

            - name: Upload assets to release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ steps.tag.outputs.tag }}
              run: |
                  set -euo pipefail
                  if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
                      gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
                  fi
                  gh release upload "$TAG" dist/fusion-code-* dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
                  echo "Assets on release $TAG:"
                  gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'
