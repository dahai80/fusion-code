name: docs

on:
  pull_request:
    paths:
      - "**.md"
      - "ci/validate_docs.py"
      - ".github/workflows/docs.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate docs contract
        run: |
          python3 ci/validate_docs.py --root . --product fusion-code \
            --class app --entry guided-ui \
            --skip-dirs ".git,node_modules,dist,logs,.ruff_cache,.fusion,.remember,.claude,web/node_modules,web/dist,web/logs,web/run,benchmarks"
